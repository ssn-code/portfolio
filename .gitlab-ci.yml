stages:
  - install
  - build
  - validate

install:
  stage: install
  script:
    - npm ci

build_frontend:
  stage: build
  script:
    - npm run build -w frontend

build_backend:
  stage: build
  script:
    - npm run build -w backend

validate:
  stage: validate
  script:
    - echo "Running validation..."
    - echo "No automated tests configured yet."
    - echo "Validation passed."