stages:
  - install
  - build
  - validate

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

install:
  stage: install
  script:
    - npm ci

build_frontend:
  stage: build
  script:
    - npm run build -w frontend

build_backend:
  stage: build
  script:
    - npm run build -w backend

validate:
  stage: validate
  script:
    - echo "Running validation..."
    - echo "No automated tests configured yet."
    - echo "Validation passed."